<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Translator</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <section class="bubble" id="bubble" data-on="false">
      <div class="bubble-text">
        <h1 class="bubble-line" id="bubbleLine">Translate images on</h1>
        <p class="site" id="site">this site</p>
      </div>
      <label class="switch" title="Translate this site automatically, including after reloads">
        <input type="checkbox" id="siteToggle" role="switch" aria-labelledby="bubbleLine site">
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
      </label>
      <svg class="tail" viewBox="0 0 26 22" aria-hidden="true">
        <polygon points="2,-3 24,-3 6,20" class="tail-fill"/>
        <polyline points="2,0 6,20 24,0" class="tail-ink"/>
      </svg>
    </section>

    <p class="notice" id="notice" hidden></p>
    <p class="work" id="work" role="status" hidden></p>

    <label class="field">
      <span>Translate to</span>
      <select id="lang"></select>
    </label>

    <div class="field size">
      <label for="size">Text size <output id="sizeOut" for="size">100%</output></label>
      <div class="size-row">
        <span class="a-small" aria-hidden="true">A</span>
        <input type="range" id="size" min="50" max="250" step="5" value="100" aria-describedby="sizeHint">
        <span class="a-big" aria-hidden="true">A</span>
      </div>
      <small class="muted" id="sizeHint">Changes the translations on open pages right away.</small>
    </div>

    <div class="actions">
      <button id="rescan" type="button">Rescan page</button>
      <button id="original" type="button">Show original</button>
    </div>

    <p class="usage" id="usage"></p>

    <footer class="foot">
      <span class="muted">Hold Alt to peek at the original.</span>
      <button class="link" id="openSettings" type="button">Settings</button>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
