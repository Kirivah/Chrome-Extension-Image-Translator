<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Image Translator test page</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; font: 15px system-ui, sans-serif; background: #f4f4f4; }
    header { position: sticky; top: 0; z-index: 5; background: #222; color: #fff; padding: 12px 20px; }
    main { max-width: 820px; margin: 0 auto; padding: 20px; }
    figure { margin: 0 0 40px; }
    img { display: block; max-width: 100%; height: auto; }
    .fit { width: 420px; height: 420px; object-fit: contain; background: #ccc; }
    .reader { height: 700px; overflow: auto; border: 3px solid #444; }
    .spacer { height: 600px; }
    .frame { position: relative; width: 600px; aspect-ratio: 3 / 2; }
    .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; transform: translateZ(0); }
  </style>
</head>
<body>
  <header>Test reader — sticky header</header>
  <main>
    <figure><img id="manga" src="http://127.0.0.1:8702/manga.png" width="800" height="1200" alt="manga page"></figure>
    <figure><div class="frame"><img id="pos" src="http://127.0.0.1:8702/positioned.png" alt="positioned"></div></figure>
    <figure><img id="sign" src="/sign.jpg" class="fit" alt="sign"></figure>
    <figure><img id="meme" alt="meme (blob)" width="600" height="400"></figure>
    <figure><img id="hot" src="http://127.0.0.1:8702/hot/hotlink.png" width="600" height="400" alt="hotlinked"></figure>
    <figure><img id="icon" src="/icon.png" width="32" height="32" alt="icon"></figure>
    <figure contenteditable="true"><img id="edit" src="/sign.jpg" width="420" height="280" alt="being edited"></figure>
    <div class="spacer"></div>
    <figure><img id="lazy" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="http://127.0.0.1:8702/lazy.png" width="600" height="450" alt="lazy"></figure>
    <div id="dyn"></div>
    <div class="spacer"></div>
    <section class="reader" id="reader">
      <img id="strip" src="http://127.0.0.1:8702/strip.png" width="600" height="3000" alt="webtoon strip">
    </section>
    <div class="spacer"></div>
  </main>
  <script>
    fetch('/meme.png').then(r => r.blob()).then(b => { document.getElementById('meme').src = URL.createObjectURL(b); });
    new IntersectionObserver((es, io) => {
      for (const e of es) if (e.isIntersecting) { e.target.src = e.target.dataset.src; io.unobserve(e.target); }
    }, { rootMargin: '200px' }).observe(document.getElementById('lazy'));
    setTimeout(() => {
      const f = document.createElement('figure');
      f.innerHTML = '<img id="dynamic" src="http://127.0.0.1:8702/dynamic.png" width="600" height="450" alt="dynamic">';
      document.getElementById('dyn').append(f);
    }, 1200);
  </script>
</body>
</html>
